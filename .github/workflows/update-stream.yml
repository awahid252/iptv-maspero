name: Update Maspero Stream URL
on:
  schedule:
    - cron: '0 */2 * * *' # Step 9: repeat this process automatically every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install the required automation tools to look at web traffic logs
      - name: Install Playwright Environment
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run DevTools Network Extraction
        run: python extract_url.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add maspero.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Maspero stream URL" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
