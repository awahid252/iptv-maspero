name: Update Maspero Stream URL
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Write M3U File Directly
        run: |
          echo "#EXTM3U" > maspero.m3u
          echo "#EXTINF:-1 tvg-name=\"Maspero Zaman\" tvg-id=\"maspero.zaman\" group-title=\"Egypt\" tvg-logo=\"https://dmcdn.net\",Maspero Zaman" >> maspero.m3u
          echo "https://dailymotion.com" >> maspero.m3u

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add maspero.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Maspero stream URL" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
