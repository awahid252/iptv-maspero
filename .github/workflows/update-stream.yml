name: Update Maspero Stream URL
on:
  schedule:
    - cron: '*/20 * * * *' # every 20 minutes so the signed URLs stay fresh
  workflow_dispatch: # Allows manual run anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install the system components required to open a headless browser on Linux
      - name: Install Playwright & Web Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run DevTools Network Extraction
        run: python extract_url.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add maspero.m3u maspero_master.m3u8
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Maspero stream URLs"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
